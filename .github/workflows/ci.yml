name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # npm run lint는 --fix가 붙어 있어 CI에서는 검사만 하도록 직접 실행한다
      - name: Lint
        run: npx eslint .

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 의존성 취약점 점검
        run: npm audit --audit-level=moderate

      - name: 단위 테스트
        run: npm test
